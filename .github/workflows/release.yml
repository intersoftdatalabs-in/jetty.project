name: Release and Publish Distribution

on:
  push:
    tags:
      - 'v9.4.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 9.4.65.2)'
        required: true
        default: '9.4.65.2'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
          server-id: 'github'
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install build-resources and parent
        run: |
          mvn clean install -f build-resources/pom.xml -DskipTests -B
          mvn install -N -DskipTests -B

      - name: Run Core Security Verification Tests
        run: |
          mvn test -pl jetty-http,jetty-security,jetty-server,jetty-proxy -am -Dtest=HttpURITest,ConstraintTest,RequestTest,ConnectHandlerTest,HttpParserTest -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: Build and Package BOM, Home, and Distribution
        run: |
          mvn clean install -pl jetty-bom,jetty-home,jetty-distribution -am -DskipTests -B

      - name: Verify Relocated Artifacts and Distribution Layout
        run: |
          test -f jetty-distribution/target/jetty-distribution-*.zip
          unzip -l jetty-distribution/target/jetty-distribution-*.zip | grep -q 'lib/jetty-http-9.4.65.2.jar'

      - name: Deploy Relocated Modules to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn deploy -N -DskipTests -B
          mvn deploy -pl build-resources,jetty-util,jetty-jmx,jetty-io,jetty-http,jetty-xml,jetty-util-ajax,jetty-server,jetty-security,jetty-client,jetty-servlet,jetty-webapp,jetty-plus,jetty-annotations,jetty-proxy,jetty-rewrite,jetty-continuation,jetty-servlets,jetty-quickstart,jetty-jaas,jetty-deploy,jetty-start,jetty-jndi,apache-jsp,apache-jstl,jetty-websocket/websocket-api,jetty-websocket/websocket-common,jetty-websocket/websocket-client,jetty-websocket/websocket-servlet,jetty-websocket/websocket-server,jetty-websocket/javax-websocket-client-impl,jetty-websocket/javax-websocket-server-impl -am -DskipTests -B
          mvn deploy -pl jetty-bom,jetty-home,jetty-distribution -DskipTests -B

      - name: Generate Checksums
        working-directory: jetty-distribution/target
        run: |
          sha256sum jetty-distribution-*.tar.gz jetty-distribution-*.zip > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            jetty-distribution/target/jetty-distribution-*.tar.gz
            jetty-distribution/target/jetty-distribution-*.zip
            jetty-distribution/target/sha256sums.txt
          generate_release_notes: true
